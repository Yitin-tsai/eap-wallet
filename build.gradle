plugins {
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.cloud.contract' version '4.3.0'
    id 'java'
}

group = 'com.eap'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.1")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'com.eap:eap-common:1.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testImplementation 'org.springframework.integration:spring-integration-core'
}

tasks.named("generateContractTests") {
    contractsDslDir = file("src/contractTest/resources/contracts")
    basePackageForTests.set("com.eap.eap_wallet")
    baseClassForTests.set("com.eap.eap_wallet.application.BaseContractTest")
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('walletAmqpLoadTest', JavaExec) {
    group = 'verification'
    description = 'Publish OrderSubmittedEvent load directly through RabbitMQ AMQP for wallet throughput testing.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_wallet.loadtest.WalletAmqpLoadGenerator'
}

tasks.register('walletMatchedDbLoadTest', JavaExec) {
    group = 'verification'
    description = 'Seed buyer/seller wallets and benchmark OrderMatchedEvent settlement DB write path.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_wallet.loadtest.WalletMatchedDbLoadGenerator'
    systemProperty 'spring.profiles.active', 'loadtest'
    systemProperty 'spring.rabbitmq.listener.simple.auto-startup', 'false'
    systemProperty 'spring.datasource.url', 'jdbc:postgresql://localhost:15433/eap_wallet_db'
    systemProperty 'spring.datasource.username', 'admin'
    systemProperty 'spring.datasource.password', 'admin123'
    systemProperty 'spring.datasource.driver-class-name', 'org.postgresql.Driver'
    systemProperty 'spring.jpa.hibernate.ddl-auto', 'validate'
    systemProperty 'spring.liquibase.enabled', 'true'
    systemProperty 'spring.liquibase.change-log', 'classpath:db/changelog/db.changelog-master.xml'
    systemProperty 'eap.wallet.outbox-relay.enabled', 'false'
}
