spring:
  datasource:
    url: jdbc:postgresql://localhost:15433/eap_wallet_db
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: 40
      minimum-idle: 12
  rabbitmq:
    cache:
      channel:
        size: 128
    listener:
      simple:
        concurrency: 4
        max-concurrency: 32
        prefetch: 20

eap:
  wallet:
    listeners:
      order-submitted:
        concurrency: 32
      trade-executed:
        concurrency: 12
        batch-size: 50
        receive-timeout-ms: 25
    outbox-relay:
      batch-size: 500
      publish-concurrency: 1
      poll-interval-ms: 100
    trade-settlement-relay:
      batch-size: 500
      poll-interval-ms: 100

logging:
  level:
    '[com.eap.eap_wallet.application.CreateOrderListener]': WARN
    '[com.eap.eap_wallet.controller.WalletController]': WARN
    '[org.springframework.amqp.rabbit.listener]': WARN
