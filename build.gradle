plugins {
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.cloud.contract' version '4.3.0'
    id 'java'
}

group = 'com.eap'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.1")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'com.eap:eap-common:1.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
    testImplementation 'org.springframework.integration:spring-integration-core'
}

tasks.named("generateContractTests") {
    contractsDslDir = file("src/contractTest/resources/contracts")
    basePackageForTests.set("com.eap.eap_wallet")
    baseClassForTests.set("com.eap.eap_wallet.application.BaseContractTest")
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'eap.integration.rabbit', System.getProperty('eap.integration.rabbit', 'false')
}

tasks.register('walletRabbitIntegrationTest', Test) {
    group = 'verification'
    description = 'Run the real RabbitMQ retry-exhaustion and dead-letter integration test.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'eap.integration.rabbit', 'true'
    systemProperty 'eap.integration.rabbit.host', System.getProperty('eap.integration.rabbit.host', 'localhost')
    systemProperty 'eap.integration.rabbit.port', System.getProperty('eap.integration.rabbit.port', '5672')
    systemProperty 'eap.integration.rabbit.user', System.getProperty('eap.integration.rabbit.user', 'admin')
    systemProperty 'eap.integration.rabbit.vhost', System.getProperty('eap.integration.rabbit.vhost', '/')
    systemProperty 'eap.integration.rabbit.password', System.getProperty(
            'eap.integration.rabbit.password', System.getenv('EAP_RABBIT_IT_PASSWORD') ?: 'admin123')
    include '**/*DeadLetterIT.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('walletPostgresIntegrationTest', Test) {
    group = 'verification'
    description = 'Run Wallet PostgreSQL concurrency integration tests against the load-test database.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'eap.integration.postgres', 'true'
    systemProperty 'eap.integration.postgres.url', System.getProperty(
            'eap.integration.postgres.url', 'jdbc:postgresql://localhost:15433/eap_wallet_db')
    systemProperty 'eap.integration.postgres.user', System.getProperty('eap.integration.postgres.user', 'admin')
    systemProperty 'eap.integration.postgres.password', System.getProperty(
            'eap.integration.postgres.password', System.getenv('EAP_POSTGRES_IT_PASSWORD') ?: 'admin123')
    include '**/WalletTradeSettlementAppenderPostgresIT.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('walletAmqpLoadTest', JavaExec) {
    group = 'verification'
    description = 'Publish OrderSubmittedEvent load directly through RabbitMQ AMQP for wallet throughput testing.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_wallet.loadtest.WalletAmqpLoadGenerator'
}

tasks.register('walletDbCeilingProbe', JavaExec) {
    group = 'verification'
    description = 'Measure isolated Wallet trade settlement SQL ceiling without RabbitMQ or Spring listener overhead.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_wallet.loadtest.WalletDbCeilingProbe'
}

tasks.register('walletOrderSubmissionDbCeilingProbe', JavaExec) {
    group = 'verification'
    description = 'Measure isolated Wallet OrderSubmitted reservation SQL ceiling without RabbitMQ or Spring listener overhead.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_wallet.loadtest.WalletOrderSubmissionDbCeilingProbe'
}

tasks.register('walletMixedDbCeilingProbe', JavaExec) {
    group = 'verification'
    description = 'Measure concurrent Wallet reservation and settlement SQL capacity on shared hot wallet rows.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_wallet.loadtest.WalletMixedDbCeilingProbe'
}
