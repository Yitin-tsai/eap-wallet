server:
  port: 8081
  servlet:
    context-path: /eap-wallet

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eapdb
    username: admin
    password: admin123
  liquibase:
    enabled: true                               
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev                                 
    drop-first: false
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
  data:
    redis:
      host: localhost
      port: 6379  
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: eap-wallet

logging:
  level:
    '[com.eap.eap_order]': DEBUG
    '[org.springframework.web]': INFO

eap:
  wallet:
    listeners:
      order-submitted:
        concurrency: 8
      order-matched:
        concurrency: 4
    outbox-admin:
      enabled: false
    outbox-relay:
      batch-size: 200
      poll-interval-ms: 500
      confirm-timeout-ms: 5000
      max-attempts: 10
      initial-backoff-ms: 1000
      max-backoff-ms: 300000
    trade-settlement-relay:
      batch-size: 200
      poll-interval-ms: 500
      confirm-timeout-ms: 5000
      max-attempts: 10
      initial-backoff-ms: 1000
      max-backoff-ms: 300000
